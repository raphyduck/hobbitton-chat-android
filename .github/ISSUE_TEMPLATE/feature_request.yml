name: Feature request
description: Suggest a new capability or improvement for the mobile app.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is the **Android client** of the hobbitton platform. The best requests start with the problem you're trying to solve, not just a proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that you can't (or that's painful) today? Describe the underlying need, not the solution.
      placeholder: When I'm on the conversation list I can't... so I end up...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the app to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Workarounds you've tried, or other ways this could be solved.
    validations:
      required: false

  - type: input
    id: server_version
    attributes:
      label: Server version (optional)
      description: Only relevant if the feature depends on a specific backend capability or version.
      placeholder: "v0.8.7"
    validations:
      required: false

  - type: textarea
    id: mockup
    attributes:
      label: Mockup / reference (optional)
      description: A sketch, a screenshot, or a link.
    validations:
      required: false
