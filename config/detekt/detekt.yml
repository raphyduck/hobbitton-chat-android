build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 300
    ignoreAnnotated:
      - "Composable"
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 20
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - "Composable"
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 100
    thresholdInInterfaces: 25
    thresholdInObjects: 20
    thresholdInEnums: 10
  NestedBlockDepth:
    threshold: 6
  CyclomaticComplexMethod:
    threshold: 60
    ignoreAnnotated:
      - "Composable"
  ComplexCondition:
    threshold: 10
  LargeClass:
    threshold: 2500

style:
  MagicNumber:
    active: false
  ReturnCount:
    max: 12
    excludeReturnFromLambda: true
    ignoreAnnotated:
      - "Composable"
  MaxLineLength:
    maxLineLength: 140
    excludeCommentStatements: true
    excludePackageStatements: true
    excludeImportStatements: true
    excludeRawStrings: true
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    active: true
    allowedNames: "(_|ignored|expected|serialVersionUID)"
    ignoreAnnotated:
      - "Preview"
  WildcardImport:
    active: true
    excludeImports:
      - "kotlinx.coroutines.flow.*"
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3
  ThrowsCount:
    max: 4
  UseCheckOrError:
    active: false
  UseRequire:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated:
      - "Composable"
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][A-Za-z0-9_]*"
  MatchingDeclarationName:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - "RuntimeException"
      - "Throwable"
    allowedExceptionNameRegex: "_|(ignore|expected).*"
  SwallowedException:
    ignoredExceptionTypes:
      - "InterruptedException"
      - "MalformedURLException"
      - "NumberFormatException"
      - "ParseException"
    allowedExceptionNameRegex: "_|(ignore|expected).*"
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - "Error"
      - "RuntimeException"
      - "Throwable"

coroutines:
  active: true

formatting:
  MaximumLineLength:
    active: false
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false
  Wrapping:
    active: false
  ArgumentListWrapping:
    active: false
  ParameterListWrapping:
    active: false
  FunctionSignature:
    active: false
